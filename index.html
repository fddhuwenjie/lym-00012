<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 路径动画与轨迹编辑工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>SVG 路径动画编辑器</h1>
            <div class="header-controls">
                <button id="btn-play" class="btn btn-primary">▶ 播放</button>
                <button id="btn-pause" class="btn">⏸ 暂停</button>
                <button id="btn-reset" class="btn">↺ 重置</button>
                <span class="time-display">
                    <span id="current-time">0.00</span>s / <span id="total-time">5.00</span>s
                </span>
            </div>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <div class="toolbar">
                    <div class="tool-group">
                        <span class="tool-label">绘制模式:</span>
                        <button id="tool-select" class="btn btn-tool active">✋ 选择</button>
                        <button id="tool-add" class="btn btn-tool">➕ 添加锚点</button>
                        <button id="tool-delete" class="btn btn-tool">🗑 删除</button>
                    </div>
                    <div class="tool-group">
                        <span class="tool-label">路径类型:</span>
                        <select id="path-type">
                            <option value="bezier">贝塞尔曲线</option>
                            <option value="line">直线</option>
                        </select>
                    </div>
                    <div class="tool-group">
                        <span class="tool-label">路径库:</span>
                        <select id="preset-paths">
                            <option value="">-- 选择预设路径 --</option>
                            <option value="circle">⚪ 圆形</option>
                            <option value="heart">❤ 爱心</option>
                            <option value="star">⭐ 星形</option>
                            <option value="wave">〰️ 波浪</option>
                            <option value="spiral">🌀 螺旋</option>
                            <option value="signature">✍️ 签名笔迹</option>
                        </select>
                        <button id="btn-load-preset" class="btn btn-small">加载</button>
                    </div>
                    <div class="tool-group">
                        <button id="btn-clear-path" class="btn btn-danger btn-small">清空路径</button>
                        <button id="btn-add-object" class="btn btn-success btn-small">+ 添加动画对象</button>
                        <button id="btn-create-group" class="btn btn-primary btn-small">+ 创建组</button>
                        <button id="btn-reverse-play" class="btn btn-warning btn-small">⏪ 路径反走查</button>
                    </div>
                </div>

                <div class="canvas-container">
                    <svg id="main-canvas" width="800" height="600" viewBox="0 0 800 600">
                        <defs>
                            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
                            </marker>
                        </defs>
                        <rect width="800" height="600" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
                        <g id="grid-layer"></g>
                        <g id="paths-layer"></g>
                        <g id="particles-layer"></g>
                        <g id="handles-layer"></g>
                        <g id="objects-layer"></g>
                    </svg>
                    <div class="canvas-hint" id="canvas-hint">点击画布添加锚点，开始绘制路径</div>
                </div>
            </div>

            <div class="right-panel">
                <div class="panel-tabs">
                    <button class="tab-btn active" data-tab="objects">对象列表</button>
                    <button class="tab-btn" data-tab="timeline">时间轴</button>
                    <button class="tab-btn" data-tab="source">SVG 源码</button>
                    <button class="tab-btn" data-tab="export">导出</button>
                </div>

                <div class="panel-content">
                    <div class="tab-pane active" id="tab-objects">
                        <div id="objects-list" class="objects-list"></div>
                    </div>

                    <div class="tab-pane" id="tab-timeline">
                        <div class="timeline-container">
                            <div class="timeline-header">
                                <div class="timeline-scale" id="timeline-scale"></div>
                            </div>
                            <div class="timeline-tracks" id="timeline-tracks"></div>
                        </div>
                    </div>

                    <div class="tab-pane" id="tab-source">
                        <div class="source-controls">
                            <label><input type="checkbox" id="show-anim-source" checked> 包含动画</label>
                            <label><input type="checkbox" id="show-controls-source"> 包含控制柄</label>
                        </div>
                        <textarea id="svg-source" readonly></textarea>
                    </div>

                    <div class="tab-pane" id="tab-export">
                        <div class="export-options">
                            <div class="export-section">
                                <h3>导出 SMIL 动画 SVG</h3>
                                <p>纯 SVG 动画，无需 JavaScript</p>
                                <button class="btn btn-primary" id="btn-export-smil">导出 SMIL SVG</button>
                            </div>
                            <div class="export-section">
                                <h3>导出 CSS 关键帧动画</h3>
                                <p>使用 CSS @keyframes 实现动画</p>
                                <button class="btn btn-primary" id="btn-export-css">导出 CSS + HTML</button>
                            </div>
                            <div class="export-section">
                                <h3>导出带 JS 控制的 HTML</h3>
                                <p>包含播放/暂停/重置控制</p>
                                <button class="btn btn-primary" id="btn-export-js">导出完整 HTML</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="object-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">编辑动画对象</h3>
            <div class="form-group">
                <label>对象名称</label>
                <input type="text" id="obj-name" placeholder="输入对象名称">
            </div>
            <div class="form-group">
                <label>对象类型</label>
                <select id="obj-type">
                    <option value="circle">圆形</option>
                    <option value="square">方形</option>
                    <option value="triangle">三角形</option>
                    <option value="diamond">菱形</option>
                    <option value="star">星形</option>
                </select>
            </div>
            <div class="form-group">
                <label>对象颜色</label>
                <input type="color" id="obj-color" value="#ff6b6b">
            </div>
            <div class="form-group">
                <label>对象大小</label>
                <input type="range" id="obj-size" min="5" max="50" value="20">
                <span id="obj-size-value">20</span>px
            </div>
            <div class="form-group">
                <label>绑定路径</label>
                <select id="obj-path"></select>
            </div>
            <div class="form-group">
                <label>起始时刻 (秒)</label>
                <input type="number" id="obj-start" min="0" step="0.1" value="0">
            </div>
            <div class="form-group">
                <label>动画时长 (秒)</label>
                <input type="number" id="obj-duration" min="0.1" step="0.1" value="3">
            </div>
            <div class="form-group">
                <label>速度倍率</label>
                <input type="range" id="obj-speed" min="0.1" max="3" step="0.1" value="1">
                <span id="obj-speed-value">1.0</span>x
            </div>
            <div class="form-group">
                <label>缓动函数</label>
                <select id="obj-easing">
                    <option value="linear">线性 (linear)</option>
                    <option value="ease">缓动 (ease)</option>
                    <option value="ease-in">缓入 (ease-in)</option>
                    <option value="ease-out">缓出 (ease-out)</option>
                    <option value="ease-in-out">缓入缓出 (ease-in-out)</option>
                    <option value="bounce">弹跳 (bounce)</option>
                    <option value="elastic">弹性 (elastic)</option>
                </select>
            </div>
            <div class="form-group">
                <label>循环模式</label>
                <select id="obj-loop">
                    <option value="none">不循环</option>
                    <option value="repeat">重复播放</option>
                    <option value="alternate">往返播放</option>
                </select>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="obj-orient"> 朝向随路径切线方向</label>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="obj-trail"> 启用轨迹粒子尾迹</label>
            </div>
            <div id="trail-options" class="trail-options hidden">
                <div class="form-group">
                    <label>粒子形状</label>
                    <select id="obj-trail-shape">
                        <option value="circle">圆点</option>
                        <option value="square">方块</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>粒子密度 (每秒)</label>
                    <input type="range" id="obj-trail-density" min="5" max="60" value="20">
                    <span id="obj-trail-density-value">20</span>
                </div>
                <div class="form-group">
                    <label>粒子生命周期 (秒)</label>
                    <input type="range" id="obj-trail-lifetime" min="0.2" max="3" step="0.1" value="1">
                    <span id="obj-trail-lifetime-value">1.0</span>s
                </div>
                <div class="form-group">
                    <label>尾迹长度</label>
                    <input type="range" id="obj-trail-length" min="10" max="200" value="50">
                    <span id="obj-trail-length-value">50</span>
                </div>
                <div class="form-group">
                    <label>粒子大小</label>
                    <input type="range" id="obj-trail-size" min="1" max="10" value="3">
                    <span id="obj-trail-size-value">3</span>px
                </div>
                <div class="form-group">
                    <label>淡出曲线</label>
                    <select id="obj-trail-fade">
                        <option value="linear">线性</option>
                        <option value="ease-in">缓入 (快→慢)</option>
                        <option value="ease-out">缓出 (慢→快)</option>
                        <option value="ease-in-out">缓入缓出</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>所属组</label>
                <select id="obj-group">
                    <option value="">-- 无组 --</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn" id="modal-cancel">取消</button>
                <button class="btn btn-primary" id="modal-save">保存</button>
            </div>
        </div>
    </div>

    <div id="group-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="group-modal-title">编辑组</h3>
            <div class="form-group">
                <label>组名称</label>
                <input type="text" id="group-name" placeholder="输入组名称">
            </div>
            <div class="form-group">
                <label>组总时长 (秒)</label>
                <input type="number" id="group-duration" min="0.5" step="0.1" value="5">
            </div>
            <div class="form-group">
                <label>群体起始相位 (0~1)</label>
                <input type="range" id="group-phase" min="0" max="1" step="0.01" value="0">
                <span id="group-phase-value">0.00</span>
            </div>
            <div class="form-group">
                <label>对象间均匀间隔</label>
                <select id="group-spacing-mode">
                    <option value="arc">等弧长间隔</option>
                    <option value="time">等时间间隔</option>
                </select>
            </div>
            <div class="form-group">
                <label>间隔数量 (N个对象形成N个间隔)</label>
                <input type="number" id="group-spacing" min="1" step="1" value="5">
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="group-reverse"> 反向播放</label>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="group-mirror-h"> 水平镜像翻转</label>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="group-mirror-v"> 垂直镜像翻转</label>
            </div>
            <div class="form-group">
                <label>组内对象</label>
                <div id="group-objects-list" class="group-objects-checkboxes"></div>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="group-trail"> 整组启用轨迹粒子尾迹</label>
            </div>
            <div class="modal-actions">
                <button class="btn" id="group-modal-cancel">取消</button>
                <button class="btn btn-primary" id="group-modal-save">保存</button>
                <button class="btn btn-danger" id="group-modal-delete">删除组</button>
            </div>
        </div>
    </div>

    <script src="js/paths.js"></script>
    <script src="js/path-editor.js"></script>
    <script src="js/animation-engine.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/exporter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
